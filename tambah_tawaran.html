<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Tawaran - Fasker Gate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://ogsstamvptbknfvaddtt.supabase.co';
        const supabaseKey = 'sb_publishable_aSaLqvCDEyJownZDN9WgOw_nCn0JAe-';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    </script>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="brand-logo" style="text-decoration: none;">
                <img src="https://i.ibb.co.com/hJsf9vqP/Logo-Fasker.png" class="brand-icon" alt="Logo Fasker">
                <div class="brand-text">
                    <div class="brand-title"><span>FASKER</span> GATE</div>
                    <div class="brand-subtitle">Pusat Fasilitas Kerja Sama</div>
                </div>
            </a>
        </div>

        <nav class="sidebar-menu">
            <a href="admin.html" class="menu-item">
                <span class="icon">⊞</span> Dashboard
            </a>
            <a href="verifikasi.html" class="menu-item">
                <span class="icon">📋</span> Verifikasi
            </a>
            <a href="unggah_tawaran.html" class="menu-item active">
                <span class="icon">📤</span> Unggah Tawaran
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-wrapper">

        <!-- TOP NAVBAR -->
        <header class="top-navbar">
            <div class="nav-left">
                <div class="hamburger">☰</div>
                <div class="welcome-text">Selamat Datang Admin Fasker!</div>
            </div>

            <div class="nav-right">
                <img src="https://i.ibb.co.com/27Q5S18X/Logo-Kemendagri-Kementerian-Dalam-Negeri.png" alt="Avatar"
                    style="width:24px; height:24px; object-fit:contain;">
                <div class="profile-name">
                    Pusat Fasker
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" style="width:16px; height:16px;">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main class="content-area">
            <div class="breadcrumb" style="margin-bottom: 12px;">Tawaran Beasiswa</div>

            <div style="display: flex; justify-content: center; align-items: flex-start; padding-top: 10px;">
                <div class="tambah-card">
                    <img src="https://i.ibb.co.com/v6PFfBh7/Logo-Fasker-Tulisan.png" class="tambah-logo" alt="Logo Fasker Gate">
                    
                    <input type="text" id="tambah-judul" class="tambah-input" placeholder="Judul">
                    <input type="text" id="tambah-periode" class="tambah-input" placeholder="Periode">
                    <input type="text" id="tambah-negara" class="tambah-input" placeholder="Negara">
                    <input type="text" id="tambah-kuantitas" class="tambah-input" placeholder="Kuantitas Penerima">
                    <input type="text" id="tambah-persyaratan" class="tambah-input" placeholder="Persyaratan">
                    <input type="text" id="tambah-detail" class="tambah-input" placeholder="Detail Beasiswa">
                    <input type="text" id="tambah-tahun" class="tambah-input" placeholder="Tahun (contoh: 2026)" value="2026">
                    <input type="text" id="tambah-toefl" class="tambah-input" placeholder="Score TOEFL (contoh: 500)">
                    <input type="text" id="tambah-ipk" class="tambah-input" placeholder="IPK (contoh: 3.5)">

                    <button class="btn-tambah-submit" onclick="handleTambahTawaran()">Unggah Beasiswa</button>
                </div>
            </div>

        </main>

    </div>

    <script>
        async function handleTambahTawaran() {
            const judul = document.getElementById('tambah-judul').value.trim();
            const periode = document.getElementById('tambah-periode').value.trim();
            const negara = document.getElementById('tambah-negara').value.trim();
            const kuantitas = document.getElementById('tambah-kuantitas').value.trim();
            const persyaratan = document.getElementById('tambah-persyaratan').value.trim();
            const toefl = document.getElementById('tambah-toefl').value.trim();
            const ipk = document.getElementById('tambah-ipk').value.trim();
            const detail = document.getElementById('tambah-detail').value.trim();
            const tahun = document.getElementById('tambah-tahun').value.trim();

            if (!judul || !periode || !negara) {
                alert('Judul, Periode, dan Negara wajib diisi!');
                return;
            }

            let extraReqs = [];
            if (ipk) extraReqs.push(`IPK ${ipk}`);
            if (toefl) extraReqs.push(`TOEFL ${toefl}`);
            
            let finalPersyaratan = persyaratan;
            if (extraReqs.length > 0) {
                finalPersyaratan = finalPersyaratan ? `${finalPersyaratan}, ${extraReqs.join(', ')}` : extraReqs.join(', ');
            }

            const newOffer = {
                judul: judul,
                periode: periode,
                negara: negara,
                kuantitas: kuantitas || '20 ASN',
                persyaratan: finalPersyaratan || '-',
                detail: detail || '-',
                tahun: tahun || '2026'
            };

            const { error } = await supabase.from('fasker_scholarships').insert([newOffer]);

            if (error) {
                alert('Gagal mengunggah beasiswa: ' + error.message);
                return;
            }

            alert('Beasiswa Berhasil Diunggah!');
            window.location.href = 'unggah_tawaran.html';
        }
    </script>

</body>

</html>
