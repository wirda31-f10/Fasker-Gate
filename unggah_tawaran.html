    <script>
        function calculateOfferStatus(tahun, periode) {
            const startYear = parseInt(tahun);
            const duration = parseInt(periode) || 1;
            const endYear = startYear + duration;
            if (endYear <= 2026) {
                return 'Selesai';
            } else {
                return 'Berjalan';
            }
        }

        let globalDynamicOffers = [];
        let globalApplications = [];

        async function loadDataAndRender() {
            if (window.supabase && typeof window.supabase.from === 'function') {
                try {
                    const { data: offersData, error: offersError } = await window.supabase.from('fasker_scholarships').select('*');
                    if (!offersError && offersData) {
                        globalDynamicOffers = offersData;
                    }

                    const { data: appsData, error: appsError } = await window.supabase.from('fasker_applications').select('scholarship_title').not('scholarship_title', 'is', null);
                    if (!appsError && appsData) {
                        globalApplications = appsData;
                    }
                } catch (err) {
                    console.error("Error loading data from Supabase:", err);
                }
            }
            renderOfferTable();
        }

        function getSisaKuota(judul, kuantitas) {
            const totalQuota = parseInt(kuantitas) || 0;
            const appliedCount = globalApplications.filter(app => app.scholarship_title === judul).length;
            const unit = kuantitas ? (kuantitas.replace(/[0-9]/g, '').trim() || 'ASN') : 'ASN';
            return `${totalQuota - appliedCount} / ${totalQuota} ${unit}`;
        }

        function renderOfferTable() {
            const tbody = document.getElementById('unggah-tbody');
            if (!tbody) return;
            const selectedTahun = document.getElementById('tahun-select').value;
            
            const staticRows = Array.from(tbody.querySelectorAll('tr[data-id]'));
            staticRows.forEach(row => {
                const tahun = row.getAttribute('data-tahun');
                const matchesTahun = !selectedTahun || tahun === selectedTahun;
                if (matchesTahun) {
                    row.style.display = '';
                    
                    // Calculate status dynamically for static row
                    const periodeCell = row.cells[2];
                    const statusCell = row.cells[8];
                    const kuantitasCell = row.cells[5];
                    const judulCell = row.cells[1];
                    
                    if (periodeCell && statusCell && kuantitasCell && judulCell) {
                        const periodeText = periodeCell.textContent.trim();
                        const status = calculateOfferStatus(tahun, periodeText);
                        
                        if (status === 'Berjalan') {
                            statusCell.innerHTML = `<button class="status-btn verified" style="pointer-events: none; cursor: default;">Berjalan</button>`;
                        } else {
                            statusCell.innerHTML = `<button class="status-btn unverified" style="pointer-events: none; cursor: default;">Selesai</button>`;
                        }

                        // Display remaining quota dynamically for static row
                        const totalKuantitas = kuantitasCell.getAttribute('data-original-kuantitas') || kuantitasCell.textContent.trim();
                        if (!kuantitasCell.getAttribute('data-original-kuantitas')) {
                            kuantitasCell.setAttribute('data-original-kuantitas', totalKuantitas);
                        }
                        const judulText = judulCell.textContent.trim();
                        const sisaText = getSisaKuota(judulText, totalKuantitas);
                        kuantitasCell.innerHTML = `<span class="table-data-text">${sisaText}</span>`;
                    }
                } else {
                    row.style.display = 'none';
                }
            });

            // Remove any dynamically appended rows
            const dynamicRows = tbody.querySelectorAll('tr:not([data-id])');
            dynamicRows.forEach(row => row.remove());

            // Load and filter dynamic rows
            const offers = globalDynamicOffers;
            let visibleIndex = staticRows.length + 1;
            
            offers.forEach((offer, idx) => {
                const offerTahun = offer.tahun || '2024';
                if (selectedTahun && offerTahun !== selectedTahun) {
                    return; // Skip if year doesn't match filter
                }

                const status = calculateOfferStatus(offerTahun, offer.periode);
                let statusHtml = '';
                if (status === 'Berjalan') {
                    statusHtml = `<button class="status-btn verified" style="pointer-events: none; cursor: default;">Berjalan</button>`;
                } else {
                    statusHtml = `<button class="status-btn unverified" style="pointer-events: none; cursor: default;">Selesai</button>`;
                }

                const sisaText = getSisaKuota(offer.judul, offer.kuantitas);
                const row = document.createElement('tr');
                row.setAttribute('data-tahun', offerTahun);
                row.style.cursor = 'pointer';
                row.addEventListener('click', (e) => showDynamicOfferDetails(idx, e));
                row.innerHTML = `
                    <td>${visibleIndex++}.</td>
                    <td><span class="table-data-text">${offer.judul}</span></td>
                    <td><span class="table-data-text">${offer.periode}</span></td>
                    <td><span class="table-data-text">${offer.persyaratan}</span></td>
                    <td><span class="table-data-text">${offer.negara}</span></td>
                    <td><span class="table-data-text">${sisaText}</span></td>
                    <td><span class="table-data-text">${offerTahun}</span></td>
                    <td>
                        <button class="btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#0d6efd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                    </td>
                    <td>${statusHtml}</td>
                `;
                tbody.insertBefore(row, tbody.firstChild);
            });

            const allRows = Array.from(tbody.rows);
            allRows.sort((a, b) => {
                const yearA = parseInt(a.getAttribute('data-tahun')) || 0;
                const yearB = parseInt(b.getAttribute('data-tahun')) || 0;
                return yearB - yearA;
            });
            allRows.forEach(row => tbody.appendChild(row));

            // Re-sequence numbers of visible rows
            let numbering = 1;
            Array.from(tbody.rows).forEach(r => {
                if (r.style.display !== 'none') {
                    r.cells[0].textContent = `${numbering++}.`;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Check for ?tahun=YYYY URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const queryTahun = urlParams.get('tahun');
            if (queryTahun) {
                document.getElementById('tahun-select').value = queryTahun;
            }

            loadDataAndRender();
        });

            if (!offer) return;

            displayOfferModal(offer, "Statis (Bawaan)");
        }

        function showDynamicOfferDetails(index, event) {
            if (event.target.closest('.status-btn')) {
                return;
            }
            if (globalDynamicOffers && globalDynamicOffers[index]) {
                const offer = globalDynamicOffers[index];
                
                const calculatedStatus = calculateOfferStatus(offer.tahun || '2024', offer.periode);
                const detailOffer = {
                    judul: offer.judul,
                    periode: offer.periode,
                    persyaratan: offer.persyaratan || '-',
                    negara: offer.negara,
                    kuantitas: offer.kuantitas || '20 ASN',
                    tahun: offer.tahun || '2024',
                    detail: offer.detail || '-',
                    status: calculatedStatus
                };
     
                displayOfferModal(detailOffer, "Dinamis (Diunggah)");
            }
        }

        function displayOfferModal(offer, tipeData) {
            const body = document.getElementById('detail-modal-body');
            body.innerHTML = `
                <div style="display:grid; grid-template-columns: 120px 1fr; row-gap: 8px; font-family:'Montserrat', sans-serif;">
                    <strong>Judul Beasiswa:</strong> <span>${offer.judul}</span>
                    <strong>Periode:</strong> <span>${offer.periode}</span>
                    <strong>Negara:</strong> <span>${offer.negara}</span>
                    <strong>Kuantitas:</strong> <span>${offer.kuantitas}</span>
                    <strong>Tahun:</strong> <span>${offer.tahun}</span>
                    <strong>Persyaratan:</strong> <span>${offer.persyaratan}</span>
                    <strong>Status Program:</strong> <span style="font-weight:700; color:${offer.status === 'Berjalan' ? '#1cc63e' : '#666'};">${offer.status}</span>
                    <strong>Tipe Data:</strong> <span style="color:#d78b10; font-weight:700;">${tipeData}</span>
                </div>
                <div style="border-top: 1px solid #eee; padding-top: 12px; margin-top: 12px; font-family:'Montserrat', sans-serif;">

                    <p style="font-size:12px; color:#555; line-height:1.5; margin:0; text-align:justify;">${offer.detail || 'Tidak ada deskripsi detail tambahan.'}</p>
                </div>
            `;
            
            const modal = document.getElementById('detail-modal');
            modal.classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }
