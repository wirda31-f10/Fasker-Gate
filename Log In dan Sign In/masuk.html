<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Fasker Gate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="masuk.css">
</head>

<body>

    <a href="../Beranda/beranda.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <div class="login-card">
        <div class="brand-logo" style="margin-bottom: 30px; mix-blend-mode: multiply;">
            <img src="https://i.ibb.co.com/hJsf9vqP/Logo-Fasker.png" class="brand-icon" alt="Logo Fasker">
            <div class="brand-text">
                <div class="brand-title"><span>FASKER</span> GATE</div>
                <div class="brand-subtitle">Pusat Fasilitas Kerja Sama</div>
            </div>
        </div>

        <div class="input-group">
            <input type="email" id="loginEmail" placeholder="Email">
        </div>

        <div class="input-group" style="margin-bottom: 40px;">
            <input type="password" placeholder="Kata Kunci">
        </div>

        <button class="btn-submit" onclick="handleLogin()">Masuk</button>
    </div>

    <script>
        function showAlert(title, message) {
            let overlay = document.getElementById('custom-alert-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'custom-alert-overlay';
                overlay.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:9999; opacity:0; transition:opacity 0.3s ease;';
                
                const box = document.createElement('div');
                box.style.cssText = 'background:#fff; border-radius:16px; padding:28px 24px; width:90%; max-width:400px; box-shadow:0 10px 25px rgba(0,0,0,0.2); transform:scale(0.9); transition:transform 0.3s ease; font-family:"Montserrat", sans-serif; text-align:center;';
                
                const titleEl = document.createElement('h3');
                titleEl.id = 'custom-alert-title';
                titleEl.style.cssText = 'margin:0 0 16px 0; color:#1a365d; font-size:20px; font-weight:800;';
                
                const msgEl = document.createElement('p');
                msgEl.id = 'custom-alert-message';
                msgEl.style.cssText = 'margin:0 0 28px 0; color:#4a5568; font-size:15px; line-height:1.5; font-weight:500;';
                
                const btn = document.createElement('button');
                btn.textContent = 'OK';
                btn.style.cssText = 'background:#0d6efd; color:#fff; border:none; padding:12px 32px; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; font-family:"Montserrat", sans-serif; transition:all 0.2s; box-shadow:0 4px 10px rgba(13, 110, 253, 0.2);';
                btn.onmouseover = () => { btn.style.background = '#0b5ed7'; btn.style.transform = 'translateY(-2px)'; };
                btn.onmouseout = () => { btn.style.background = '#0d6efd'; btn.style.transform = 'translateY(0)'; };
                btn.onclick = () => {
                    overlay.style.opacity = '0';
                    box.style.transform = 'scale(0.9)';
                    setTimeout(() => overlay.style.display = 'none', 300);
                };
                
                box.appendChild(titleEl);
                box.appendChild(msgEl);
                box.appendChild(btn);
                overlay.appendChild(box);
                document.body.appendChild(overlay);
            }
            
            document.getElementById('custom-alert-title').textContent = title;
            document.getElementById('custom-alert-message').textContent = message;
            
            overlay.style.display = 'flex';
            // Trigger reflow
            void overlay.offsetWidth;
            overlay.style.opacity = '1';
            overlay.querySelector('div').style.transform = 'scale(1)';
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.toLowerCase().trim();
            if (email.includes('admin')) {
                window.location.href = '../Admin/admin.html';
            } else {
                const registeredEmail = localStorage.getItem('asn_email');
                if (!registeredEmail || registeredEmail.toLowerCase() !== email) {
                    showAlert('Halo', 'Email belum terdaftar. Silakan buat akun terlebih dahulu.');
                    return;
                }
                
                const asnNama = localStorage.getItem('asn_nama') || 'ASN';
                const apps = JSON.parse(localStorage.getItem('asn_applications') || '[]');
                const userApp = apps.find(app => (app.email && app.email.toLowerCase() === email) || app.nama === asnNama);
                
                if (!userApp || userApp.status !== 'Verified') {
                    if (userApp && userApp.status === 'Unverified') {
                        showAlert('Halo, ' + asnNama, 'Mohon maaf, pendaftaran Anda ditolak oleh Admin.');
                    } else {
                        showAlert('Halo, ' + asnNama, 'Data Anda belum diverifikasi oleh Admin. Harap menunggu proses verifikasi sebelum masuk.');
                    }
                    return;
                }
                
                window.location.href = '../ASN/asn.html';
            }
        }
    </script>
</body>

</html>
