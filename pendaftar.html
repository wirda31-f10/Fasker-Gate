        function getSyaratFromBeasiswa(judulBeasiswa) {
            const staticOffers = [
                { judul: "Awards Scholarship Australia", persyaratan: "IPK > 3.0, TOEFL > 500" },
                { judul: "Leadership Training In Korea", persyaratan: "IPK > 3.0, TOEFL > 500" },
                { judul: "Fullbright Program USA", persyaratan: "IPK > 3.0, TOEFL > 500" },
                { judul: "JICA Training Program Japan", persyaratan: "IPK > 3.0, TOEFL > 500" },
                { judul: "Ranu (Beasiswa Thailand)", persyaratan: "IPK > 3.0" },
                { judul: "Ranu (Beasiswa Vietnam)", persyaratan: "IPK > 3.0" },
                { judul: "Ranu (Beasiswa Singapura)", persyaratan: "IPK > 3.0" },
                { judul: "Ranu (Beasiswa Malaysia)", persyaratan: "IPK > 3.0" },
                { judul: "Ranu (Beasiswa Kamboja)", persyaratan: "IPK > 3.0" },
                { judul: "Ranu (Beasiswa Amerika)", persyaratan: "IPK > 3.0" },
                { judul: "Ranu (Beasiswa Inggris)", persyaratan: "IPK > 3.0" },
                { judul: "Ranu (Beasiswa Australia)", persyaratan: "IPK > 3.0" },
                { judul: "Ranu (Beasiswa Selandia Baru)", persyaratan: "IPK > 3.0" },
                { judul: "Ranu (Beasiswa Korea)", persyaratan: "IPK > 3.0" },
                { judul: "Ranu (Beasiswa Jepang)", persyaratan: "IPK > 3.0" }
            ];
            
            const dynamicOffers = window.allScholarshipsList || [];
            const allOffers = [...staticOffers, ...dynamicOffers];
            
            const offer = allOffers.find(o => o.judul === judulBeasiswa);
            
            let minIpk = 0;
            let minToefl = 0;
            
            if (offer && offer.persyaratan) {
                const ipkMatch = offer.persyaratan.match(/IPK\s*[>=]\s*([\d\.]+)/i);
                if (ipkMatch) minIpk = parseFloat(ipkMatch[1]);
                
                const toeflMatch = offer.persyaratan.match(/TOEFL\s*[>=]\s*(\d+)/i);
                if (toeflMatch) minToefl = parseInt(toeflMatch[1]);
            }
            
            return { minIpk, minToefl };
        }

        function checkSyarat(ipk, toefl, judulBeasiswa, fileSurat, fileFormulir, fileCv, fileToefl) {
            const ipkVal = parseFloat(ipk) || 0;
            const toeflVal = parseInt(toefl) || 0;
            
            // Cek kesesuaian file PDF yang diinput (apakah ada/lengkap)
            if (!fileSurat || !fileFormulir || !fileCv || !fileToefl) {
                return "Belum Memenuhi Syarat";
            }
            
            const syarat = getSyaratFromBeasiswa(judulBeasiswa);
            
            if (ipkVal >= syarat.minIpk && toeflVal >= syarat.minToefl) {
                return "Memenuhi Syarat";
            }
            return "Belum Memenuhi Syarat";
        }

        async function renderTable() {
            const tbody = document.getElementById('verifikasi-tbody');
            const selectedTahun = document.getElementById('tahun-select').value;
            const selectedStatus = document.getElementById('status-select').value;
            
            const deletedStatics = JSON.parse(localStorage.getItem('deleted_static_rows') || '[]');
            
            tbody.innerHTML = '';
            const rowsToRender = [];

            // Add dynamic rows and scholarships from Supabase
            let apps = [];
            let offers = [];
            if (window.supabase) {
                try {
                    const { data: appsData, error: appsError } = await supabase
                        .from('fasker_applications')
                        .select('*')
                        .not('scholarship_title', 'is', null);
                    if (!appsError && appsData) {
                        apps = appsData;
                    }
                    
                    const { data: offersData, error: offersError } = await supabase
                        .from('fasker_scholarships')
                        .select('*');
                    if (!offersError && offersData) {
                        offers = offersData;
                    }
                } catch (err) {
                    console.error("Error fetching data from Supabase:", err);
                }
            }
            window.currentDynamicApps = apps;
            window.allScholarshipsList = offers;

            // Add static rows

                if (deletedStatics.includes(row.id)) return;
                
                const asnData = staticASNs[row.id];

                const mockFormulir = `${asnData.nama.toLowerCase()}_formulir_lamaran.pdf`;

                const mockToefl = `${asnData.nama.toLowerCase()}_toefl.pdf`;

                const matchesTahun = !selectedTahun || row.tahun === selectedTahun;
                const matchesStatus = !selectedStatus || status === selectedStatus;

                    tr.setAttribute('data-tahun', row.tahun);

                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                            </button>

                        <td>${statusHtml}</td>
                    `;
                    rowsToRender.push(tr);
                }

            apps.forEach((app, idx) => {

                // Assign mock ipk and toefl, making sure to avoid using the PDF filename as a score

                } else {
                    // Fallback to calculation

                const statusHtml = status === 'Memenuhi Syarat'

                        : `<button class="status-btn unverified" style="pointer-events: none; cursor: default; width: 140px; font-size: 11px;">Belum Memenuhi</button>`;
                        
                const tr = document.createElement('tr');
                tr.setAttribute('data-type', 'dynamic');
                tr.setAttribute('data-index', idx);
                tr.setAttribute('data-tahun', appTahun);
                tr.style.cursor = 'pointer';
                tr.addEventListener('click', (e) => showDynamicDetails(idx, e));
                
                tr.innerHTML = `
                    <td></td>
                    <td><input type="text" class="table-input" value="${app.nama}" readonly style="pointer-events: none;"></td>
                    <td><input type="text" class="table-input" value="${app.instansi}" readonly style="pointer-events: none;"></td>

                    <td><input type="text" class="table-input" value="${app.nip}" readonly style="pointer-events: none;"></td>
                    <td><input type="text" class="table-input" value="${appTahun}" readonly style="pointer-events: none; width: 45px;"></td>
                    <td><input type="text" class="table-input" value="${appBeasiswa}" readonly style="pointer-events: none; width: 140px;"></td>
                    <td><input type="text" class="table-input" value="${appIpk}" readonly style="pointer-events: none; width: 35px; text-align: center;"></td>
                    <td><input type="text" class="table-input" value="${appToefl}" readonly style="pointer-events: none; width: 45px; text-align: center;"></td>
                    <td>
                        <button class="btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#0d6efd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                    </td>
                    <td>${statusHtml}</td>
                `;
                rowsToRender.push(tr);

            });
            
            let visibleIndex = 1;
            rowsToRender.forEach(row => {
                row.cells[0].textContent = `${visibleIndex++}.`;
                tbody.appendChild(row);
            });
        }

                const filename = parts.pop();
                const displayLabel = filename.split('_').slice(2).join('_') || filename;
                return `<a href="${fileUrl}" target="_blank" class="doc-link" style="color:#0d6efd; text-decoration:none; display:flex; align-items:center; gap:6px;">📄 ${label}: <span style="text-decoration:underline;">${decodeURIComponent(displayLabel)}</span></a>`;
            }
            return `<a href="#" class="doc-link" style="color:#0d6efd; text-decoration:none; display:flex; align-items:center; gap:6px;" onclick="event.preventDefault(); alert('Membuka file: ${fileUrl}')">📄 ${label}: <span style="text-decoration:underline;">${fileUrl}</span></a>`;
        }

        function displayDetailModal(asn, tipeData) {
            const body = document.getElementById('detail-modal-body');
            body.innerHTML = `
                <div style="font-family:'Montserrat', sans-serif;">
                    <strong style="display:block; margin-bottom: 12px; color: #1a365d;">Dokumen yang Dicantumkan ASN:</strong>
                    <div style="display:flex; flex-direction:column; gap:10px;">
                        ${getLinkHtml(asn.surat, 'Surat Permohonan')}
                        ${getLinkHtml(asn.formulir, 'Formulir Lamaran')}
                        ${getLinkHtml(asn.cv, 'Curriculum Vitae (CV)')}
                        ${getLinkHtml(asn.toefl, 'Sertifikat TOEFL')}
                    </div>
                </div>
            `;
            
            const modal = document.getElementById('detail-modal');
            modal.classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTable();
        });
    </script>

    <!-- DETAIL MODAL OVERLAY -->
    <div id="detail-modal" class="custom-modal-overlay">
        <div class="custom-modal-box" style="width: 480px;">
            <div class="custom-modal-header" style="background:#FDF5E6; color:#1a365d; font-weight:700;">
                🔍 Detail Dokumen Pemohon
            </div>
            <div class="custom-modal-body" id="detail-modal-body" style="font-weight: 500; font-size: 13px; line-height: 1.6; text-align: left; padding: 24px;">
                <!-- Filled dynamically -->
            </div>
            <div class="custom-modal-footer" style="padding: 0 24px 20px;">
                <button class="custom-modal-btn" onclick="closeDetailModal()">Tutup</button>
            </div>
        </div>
    </div>

</body>
